[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rlc-python"
version = "0.1.0"
description = "Python port of the RLdev Kepago compiler for RealLive"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "RLDev contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Software Development :: Compilers",
]

[project.scripts]
rlc = "rlc.main:main"

[dependency-groups]
dev = ["ruff>=0.13.0,<0.15"]

[tool.hatch.build.targets.wheel]
packages = ["src/rlc"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
