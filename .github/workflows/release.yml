name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: Verify tag and package version
        run: |
          package_version="$(uv run --isolated --no-project --with ./dist/*.whl rlc --version)"
          test "$package_version" = "rlc ${GITHUB_REF_NAME#v}"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --draft
          --generate-notes
          --title "RLC Python ${GITHUB_REF_NAME#v}"
